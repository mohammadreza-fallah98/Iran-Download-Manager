# nginx site for https://idm.asratech.ir
# Built like the other product sites: the landing page, css, js and fonts come from the shared
# /var/www/asratech.ir tree; only the download files and the logo live in /var/www/idm.
# TLS on 443 with the shared certificate (ArvanCloud connects here); port 80 redirects to https.
server {
    server_name idm.asratech.ir;
    root /var/www/idm;

    location = / { root /var/www/asratech.ir; rewrite ^ /p/idm/index.html break; }
    location ^~ /p/ { root /var/www/asratech.ir; }
    location ^~ /css/ { root /var/www/asratech.ir; }
    location ^~ /js/ { root /var/www/asratech.ir; }
    location ^~ /fonts/ { root /var/www/asratech.ir; }

    # Package files are always downloaded, never opened or installed by the browser
    location ^~ /downloads/ {
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1h;
    }

    location = /logo.png { expires 7d; }

    location / { return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/idm.asratech.ir.access.log;
    error_log  /var/log/nginx/idm.asratech.ir.error.log;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/asratech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asratech.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name idm.asratech.ir;
    location / { return 301 https://$host$request_uri; }
}
