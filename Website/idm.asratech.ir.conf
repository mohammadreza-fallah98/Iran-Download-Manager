# nginx site for https://idm.asratech.ir
# Same layout as the other asratech.ir sites: TLS on 443 with the shared certificate
# (ArvanCloud terminates the public TLS and connects here), port 80 redirects to https.
server {
    server_name idm.asratech.ir;
    root /var/www/idm;
    index index.html;

    # extra types the default mime table does not know
    types {
        application/x-xpinstall xpi;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Package files are always downloaded, never opened or installed by the browser
    location ^~ /downloads/ {
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1h;
    }

    location ^~ /fonts/ {
        expires 30d;
    }

    access_log /var/log/nginx/idm.asratech.ir.access.log;
    error_log  /var/log/nginx/idm.asratech.ir.error.log;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/asratech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asratech.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name idm.asratech.ir;
    location / { return 301 https://$host$request_uri; }
}
